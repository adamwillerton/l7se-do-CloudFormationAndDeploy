AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 web server for a static website

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  WebsiteSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  WebsiteServer:
    Type: AWS::EC2::Instance
    CreationPolicy: # this policy means don't mark the server as created until a 'ready' signal is seen.
      ResourceSignal:
        Timeout: PT10M # 10 minute timeout
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: vockey
      SecurityGroupIds:
        - !GetAtt WebsiteSecurityGroup.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y httpd aws-cfn-bootstrap
          systemctl enable --now httpd
          # send the 'ready'/success signal if the server is complete and httpd is started (or a failure signal if not)
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource WebsiteServer --region ${AWS::Region} 

Outputs:
  PublicIp:
    Value: !GetAtt WebsiteServer.PublicIp
